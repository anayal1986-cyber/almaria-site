<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00293B">
<title>Almaria Residence — Building Management Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 540'%3E%3Crect width='640' height='540' fill='%2300293B'/%3E%3Cg fill='none' stroke='%23E8C058' stroke-width='40'%3E%3Cpath d='M35 520V225L230 25L320 116'/%3E%3Cpath d='M229 520V226L425 25L615 226V520'/%3E%3Cpath d='M365 155L425 218V520'/%3E%3Cpath d='M325 375V520'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  /* Almaria brand — UI chrome only */
  --teal-900:#00293B; --teal-800:#00374E; --teal:#004860; --teal-600:#0A5B75;
  --gold:#E8C058; --gold-deep:#C99B32; --gold-soft:#FBF3DE; --gold-ink:#7A5C12;

  /* chart series — validated set (see note in the app) */
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  /* status — fixed, never themed; always with icon + label */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-soft:#E6F4E6; --warning-soft:#FDF3DD; --serious-soft:#FCEDE6; --critical-soft:#FAE8E8;

  /* chart chrome */
  --surface:#FFFFFF; --plane:#F4F6F7;
  --ink:#0F2530; --ink-2:#41545F; --muted:#7C8D97;
  --grid:#E8EDEF; --axis:#CBD5D9; --line:#E2E8EA;
  --r:12px; --shadow:0 1px 2px rgba(15,37,48,.05), 0 6px 18px rgba(15,37,48,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;
  background:var(--plane); color:var(--ink); font-size:14px; line-height:1.5;
  display:flex; overflow:hidden;
}
body.ar{font-family:"Noto Sans Arabic",system-ui,"Segoe UI",sans-serif}
button{font-family:inherit}

/* ---------------- sidebar ---------------- */
.side{
  width:236px; flex:none; background:var(--teal-900); color:#fff;
  display:flex; flex-direction:column; height:100vh
}
.side .brand{padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.10)}
.side .brand img{height:15px;width:206px;object-fit:contain;display:block;opacity:.95}
.side .brand .sub{
  font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.5);
  margin-top:9px; font-weight:700
}
.nav{flex:1; overflow-y:auto; padding:12px 10px}
.nav button{
  width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px; margin-bottom:2px;
  border:none; background:none; color:rgba(255,255,255,.72); border-radius:9px;
  font-size:13.5px; font-weight:600; cursor:pointer; text-align:start
}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff}
.nav button.on{background:rgba(232,192,88,.14); color:var(--gold)}
.nav .grp{
  font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.34);
  padding:16px 12px 7px; font-weight:800
}
.nav .cnt{
  margin-inline-start:auto; background:rgba(255,255,255,.14); color:#fff; border-radius:20px;
  padding:1px 7px; font-size:11px; font-weight:700
}
.nav button.on .cnt{background:var(--gold); color:var(--teal-900)}
.side .foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,.10); font-size:11.5px; color:rgba(255,255,255,.45)}

/* ---------------- main ---------------- */
.main{flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden}
.top{
  flex:none; background:#fff; border-bottom:1px solid var(--line);
  padding:14px 26px; display:flex; align-items:center; gap:16px
}
.top h1{margin:0; font-size:19px; font-weight:800; letter-spacing:-.01em}
.top .sub{font-size:12.5px; color:var(--muted); margin-top:1px}
.spacer{flex:1}
.tbtn{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 13px;
  font-size:12.5px; font-weight:700; color:var(--ink-2); cursor:pointer; display:flex; align-items:center; gap:7px
}
.tbtn:hover{border-color:var(--teal-600); color:var(--teal)}
.tbtn.pri{background:var(--teal); border-color:var(--teal); color:#fff}
.tbtn.pri:hover{background:var(--teal-600)}
.who{display:flex; align-items:center; gap:10px; padding-inline-start:14px; border-inline-start:1px solid var(--line)}
.who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0A5B75,#00293B);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.who .nm{font-size:12.5px;font-weight:700;line-height:1.25}
.who .rl{font-size:11px;color:var(--muted)}

.scroll{flex:1; overflow-y:auto; padding:22px 26px 40px}

/* ---------------- primitives ---------------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card .hd{padding:15px 18px 0; display:flex; align-items:flex-start; gap:12px}
.card .hd h2{margin:0; font-size:14.5px; font-weight:800}
.card .hd .d{font-size:12px; color:var(--muted); margin-top:2px}
.card .bd{padding:16px 18px 18px}
.grid{display:grid; gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
@media (max-width:1240px){.g6{grid-template-columns:repeat(3,1fr)} .g21,.g12,.g2{grid-template-columns:1fr}}
.mb{margin-bottom:16px}
.sect{font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:800; margin:26px 0 12px}
.sect:first-child{margin-top:0}

/* stat tile */
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow)}
.stat .k{font-size:11.5px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}
.stat .v{font-size:27px; font-weight:800; letter-spacing:-.02em; margin:7px 0 3px; line-height:1}
.stat .m{font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:5px}
.up{color:var(--good)} .down{color:var(--critical)} .flat{color:var(--muted)}
.meter{height:5px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--teal-600)}

/* pill / status — icon + label, never colour alone */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill svg{flex:none}
.p-good{background:var(--good-soft);color:#0a7a0a}
.p-warn{background:var(--warning-soft);color:#8a6205}
.p-ser{background:var(--serious-soft);color:#a54f26}
.p-crit{background:var(--critical-soft);color:#a52c2c}
.p-neut{background:#EEF2F3;color:#546873}
.p-info{background:#E7F0F4;color:#00506B}

/* table */
table{width:100%;border-collapse:collapse}
th{
  text-align:start; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:800; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; background:#FBFCFC
}
td{padding:11px 12px; border-bottom:1px solid var(--grid); font-size:13px; vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:focus-visible{outline:2px solid var(--teal-600);outline-offset:-2px}
tbody tr.click:hover{background:#F7FAFB}
.num{text-align:end; font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-2)}
.tw{overflow-x:auto}
.strong{font-weight:700}
.sub2{font-size:11.5px;color:var(--muted)}

/* inline magnitude bar inside a table cell */
.ibar{display:flex;align-items:center;gap:8px;min-width:120px}
.ibar .t{flex:1;height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.ibar .t i{display:block;height:100%;border-radius:99px;background:var(--series-1)}
.ibar .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-2);min-width:56px;text-align:end}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 11px;
  font-size:12.5px; font-family:inherit; color:var(--ink); font-weight:600; outline:none
}
.filters select:focus,.filters input:focus{border-color:var(--teal-600)}
.chipf{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.chipf.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:6px;vertical-align:-1px}
.viewtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewtog button{border:none;background:#fff;padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.viewtog button.on{background:var(--teal);color:#fff}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{
  position:absolute;pointer-events:none;background:var(--teal-900);color:#fff;border-radius:8px;
  padding:8px 11px;font-size:12px;font-weight:600;opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,41,59,.25)
}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;color:var(--gold);font-weight:700;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px}
.tip .r i{width:8px;height:8px;border-radius:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(9,26,34,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(600px,94vw);background:var(--plane);
  z-index:50;transform:translateX(102%);transition:transform .26s cubic-bezier(.3,.8,.35,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(9,26,34,.18)
}
html[dir="rtl"] .drawer{transform:translateX(-102%)}
.drawer.on{transform:translateX(0)!important}
.drawer .dh{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:flex-start;gap:12px;flex:none}
.drawer .dh h2{margin:0;font-size:16px;font-weight:800}
.drawer .db{flex:1;overflow-y:auto;padding:18px 20px 30px}
.x{border:none;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:flex}
.x:hover{background:var(--grid);color:var(--ink)}

.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:700}

.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding-inline-start:24px;padding-bottom:16px}
.tl li::before{content:"";position:absolute;inset-inline-start:0;top:4px;width:10px;height:10px;border-radius:50%;background:var(--good)}
.tl li.now::before{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.tl li.todo::before{background:#fff;border:2px solid var(--axis)}
.tl li::after{content:"";position:absolute;inset-inline-start:4.5px;top:15px;bottom:0;width:1.5px;background:var(--grid)}
.tl li:last-child::after{display:none}
.tl .s{font-size:13px;font-weight:700}
.tl .m{font-size:11.5px;color:var(--muted);margin-top:1px}

label.f{display:block;font-size:11.5px;font-weight:800;color:var(--ink-2);margin:0 0 6px}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;font-weight:600;color:var(--ink);outline:none}
.inp:focus{border-color:var(--teal-600)}
.req{color:var(--critical)}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.warnbox{background:var(--warning-soft);border:1px solid #F2DFB0;border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:600;color:#7A5C12;display:flex;gap:9px;align-items:flex-start}
.okbox{background:var(--good-soft);border:1px solid #C8E6C8;border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:600;color:#0a7a0a;display:flex;gap:9px;align-items:flex-start}
.btn{border:none;border-radius:9px;padding:11px 16px;font-size:13.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--teal);color:#fff}
.btn.pri:disabled{background:#B9C6CC;cursor:not-allowed}
.btn.gh{background:#fff;color:var(--ink-2);border:1px solid var(--line)}

.toast{position:fixed;bottom:22px;inset-inline-end:22px;background:var(--teal-900);color:#fff;border-radius:10px;
  padding:13px 17px;font-size:13px;font-weight:700;z-index:80;opacity:0;transform:translateY(8px);transition:.2s;
  display:flex;gap:9px;align-items:center;max-width:420px;box-shadow:0 10px 30px rgba(0,41,59,.3)}
.toast.on{opacity:1;transform:none}

.empty{text-align:center;padding:46px 20px}
.empty .ei{color:#C7D2D7}
.empty .et{font-size:15px;font-weight:800;color:var(--ink-2);margin:12px 0 5px}
.empty .ed{font-size:13px;color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.demo{
  background:var(--gold-soft);border:1px solid #EFDFB4;border-radius:9px;padding:10px 13px;
  font-size:12px;font-weight:700;color:var(--gold-ink);display:flex;gap:9px;align-items:center;margin-bottom:16px
}
html[dir="rtl"] .flipi{transform:scaleX(-1)}
@media (max-width:900px){
  body{overflow:auto}
  .side{display:none}
  .main{height:auto}
}

.linkchip{text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
  background:#E8F5EE;color:#136B43;font-size:12px;font-weight:700;border:1px solid #BFE3D0;white-space:nowrap}
.linkchip i{width:7px;height:7px;border-radius:50%;background:#1B9E5F;flex:none}
.linkchip.off{background:#F3F5F6;color:#6B7780;border-color:#DDE3E6}
.linkchip.off i{background:#9AA4AC}
@keyframes linkpulse{0%{box-shadow:0 0 0 0 rgba(27,158,95,.55)}70%{box-shadow:0 0 0 9px rgba(27,158,95,0)}100%{box-shadow:0 0 0 0 rgba(27,158,95,0)}}
.linkchip.pulse i{animation:linkpulse 1.1s ease-out}
tr.fromapp td:first-child::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--gold,#B8912F);margin-inline-start:6px;vertical-align:middle}
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <img id="brandLock" alt="Almaria Residence">
    <div class="sub" id="brandSub">Management Console</div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="foot" id="sideFoot"></div>
</aside>

<div class="main">
  <header class="top">
    <div>
      <h1 id="pgTitle"></h1>
      <div class="sub" id="pgSub"></div>
    </div>
    <div class="spacer"></div>
    <button class="tbtn" onclick="setLang(LANG==='en'?'ar':'en')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
      <span id="langLbl">العربية</span>
    </button>
    <a class="linkchip" id="linkdot" href="index.html" target="_blank" rel="noopener" title="Open the resident app in a second tab — the two update each other"><i></i><span id="linkLbl"></span></a>
    <button class="tbtn" id="sbBtn" onclick="sbOpen()"></button>
    <button class="tbtn" id="impBtn" onclick="importOpen()"></button>
    <button class="tbtn" id="expBtn" onclick="toast(T('t_export'))"></button>
    <div class="who">
      <div class="av">MS</div>
      <div>
        <div class="nm" id="whoNm"></div>
        <div class="rl" id="whoRl"></div>
      </div>
    </div>
  </header>
  <div class="scroll" id="page"></div>
</div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>

    }catch(e){ cache = null; ok = false; }
    if(!cache || cache.v !== 1) cache = BLANK();
    /* a stored record must still carry every branch */
    if(!cache.wo) cache.wo = {};
    if(!Array.isArray(cache.newWO)) cache.newWO = [];
    if(!Array.isArray(cache.anns)) cache.anns = [];
    if(!cache.pay) cache.pay = {};
    return cache;
  }

  /* Mutate under a fresh read so a change made in the other tab between our
     last read and this write is never overwritten. */
  function commit(mutate, who){
    const s = read();
    try{ mutate(s); }catch(e){ console.error('LINK.commit', e); return s; }
    s.rev  = (s.rev||0) + 1;
    s.at   = Date.now();
    s.by   = who || '';
    try{ localStorage.setItem(KEY, JSON.stringify(s)); }
    catch(e){ ok = false; console.error('LINK.persist', e); }
    if(bc){ try{ bc.postMessage({rev:s.rev, by:s.by}); }catch(e){} }
    return s;
  }

  function fire(msg){
    const s = read();
    subs.forEach(fn => { try{ fn(s, msg||{}); }catch(e){ console.error('LINK.subscriber', e); } });
  }

  try{ bc = ('BroadcastChannel' in window) ? new BroadcastChannel(CHAN) : null; }
  catch(e){ bc = null; }
  if(bc) bc.onmessage = ev => fire(ev && ev.data);
  /* fires only in the OTHER tabs, which is exactly what is wanted */
  window.addEventListener('storage', e => { if(e.key === KEY) fire({by:'storage'}); });

  function reset(){
    try{ localStorage.removeItem(KEY); }catch(e){}
    cache = BLANK();
    if(bc){ try{ bc.postMessage({rev:0, by:'reset'}); }catch(e){} }
    return cache;
  }

  read();
  return {
    get: read,
    commit,
    reset,
    onChange: fn => subs.push(fn),
    healthy: () => ok,
    live: () => !!bc
  };
})();

/* ---------------------------- LINK: console side ----------------------------
   Applies the shared record over the seeded data. Deltas are absolute field
   values and new items are guarded by id, so applying twice is the same as
   applying once — a re-render can never double-count. */
function LINK_apply(s){
  /* 1. requests raised by residents in the app */
  (s.newWO||[]).forEach(n=>{
    if(WOS.some(w=>w.id===n.id)) return;
    const u = UNITS.find(x=>x.u===n.unit);
    const c = CAT(n.cat) || {sla:8};
    const raised = new Date(n.raised);
    WOS.unshift({
      id:n.id, cat:n.cat, unit:n.unit,
      tenant:(u&&u.tenant)||n.tenant||'—', tenant_ar:(u&&u.tenant_ar)||n.tenant_ar||'—',
      desc:n.desc||'Service request', pri:n.pri||'med', ch:'app', raised,
      respH:0, closeH:0, target:c.sla, breached:false,
      status:'submitted', tech:'—', tech_ar:'—', supplier:false,
      labH:0, mat:0, rating:null,
      month:raised.getFullYear()+'-'+String(raised.getMonth()+1).padStart(2,'0'),
      fromApp:true
    });
  });

  /* 2. status, assignment, cost and rating changes */
  Object.keys(s.wo||{}).forEach(id=>{
    const w = WOS.find(x=>x.id===id); if(!w) return;
    const d = s.wo[id];
    if(d.status !== undefined) w.status = d.status;
    if(d.tech   !== undefined){ w.tech = d.tech; w.tech_ar = d.tech_ar || d.tech;
                                const t = TECHS.find(x=>x.n===d.tech); w.supplier = !!(t && t.type==='sup'); }
    if(d.labH   !== undefined) w.labH = d.labH;
    if(d.mat    !== undefined) w.mat  = d.mat;
    if(d.note   !== undefined) w.note = d.note;
    if(d.rating !== undefined) w.rating = d.rating;
  });
  WOS.sort((a,b)=>b.raised-a.raised);

  /* 3. announcements — the console is where they are written, but a second
        console tab or a reload has to pick them up too */
  (s.anns||[]).forEach(a=>{
    if(ANNS.some(x=>x.id && x.id===a.id)) return;
    ANNS.unshift({id:a.id, en:a.en, ar:a.ar, aud:a.aud||'all', st:a.st||'published', date:a.date, ok:true});
  });

  /* 4. lease terms confirmed against a contract document */
  Object.keys(s.leases||{}).forEach(id=>{
    const u = UNITS.find(x=>x.u===id); if(!u) return;
    const c = s.leases[id];
    if(c.start) u.leaseStart = new Date(c.start);
    if(c.end)   u.leaseEnd   = new Date(c.end);
    if(c.value) u.rent = c.value;
    if(c.value && c.n && c.start){
      const rows=[]; let left=c.value;
      for(let i=0;i<c.n;i++){
        const d=new Date(c.start); d.setMonth(d.getMonth()+i);
        const amt = i===c.n-1 ? left : Math.round(c.value/c.n);
        left -= amt;
        rows.push({q:i+1, amt, due:d, billed:d<=TODAY, paid:false, paidOn:null});
      }
      u.inst = rows;
    }
    if(c.value || c.start) u.occupied = true;
  });

  /* 5. instalments recorded as received — after the schedule they settle */
  Object.keys(s.pay||{}).forEach(uid=>{
    const u = UNITS.find(x=>x.u===uid); if(!u || !u.inst) return;
    const paid = (s.pay[uid]||{}).paid || {};
    Object.keys(paid).forEach(n=>{
      const row = u.inst.find(x=>String(x.q)===String(n)); if(!row) return;
      row.paid = true;
      row.paidOn = paid[n].on ? new Date(paid[n].on) : (row.due || TODAY);
      row.ref = paid[n].ref;
    });
  });

  /* jobs entered from supplier invoices */
  (s.jobs||[]).forEach(j=>{
    const u = UNITS.find(x=>x.u===j.unit);
    logJobAdd(j, u, new Date(j.date + 'T12:00:00'));
  });

  /* a register imported on this machine replaces the published one */
  if(s.register && s.register.length && typeof applyRegister === 'function'){
    applyRegister(s.register);
  } else {
    recompute();
  }
}

const LINK_wo = (id, delta) => LINK.commit(s=>{ s.wo[id] = Object.assign({}, s.wo[id], delta); }, 'console');

function LINK_boot(){
  /* The console owns the reference series. Publishing the next free number
     means a request raised in the app continues the same run rather than
     colliding with a job that already exists here. */
  LINK.commit(s=>{
    const maxSeq = WOS.reduce((m,w)=>{
      const n = parseInt(String(w.id).split('-').pop(), 10);
      return isNaN(n) ? m : Math.max(m, n);
    }, 0);
    s.nextSeq = Math.max(s.nextSeq||0, maxSeq+1);
  }, 'console');
  LINK_apply(LINK.get());
  LINK.onChange(s=>{ LINK_apply(s); render(); linkFlash(); });
}

/* ==========================================================================
   REGISTER IMPORT

   Reads بيان ايجارات الشقق .xlsx in the browser and rebuilds the register from
   it, applying the same reconciliation rules that were applied by hand:
   locate columns by their Arabic headers rather than by position, score
   duplicate rows to find the live contract, split the two-line instalment
   cells, and fill paid instalments from the sheet's own collected total.

   No library. The zip is read directly and inflated with the browser's own
   DecompressionStream, so the file stays a single self-contained page.

   Imported data is held in this browser only. It is never uploaded, and a
   visitor to the public link sees the published figures, not yours.
   ========================================================================== */

/* ---------------------------- zip ---------------------------- */
async function zipEntries(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('not_zip');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('bad_central_directory');
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    out[name] = {method, csize, lho};
    p += 46 + nlen + elen + clen;
  }
  return {dv, u8, entries: out};
}

async function zipRead(zip, name){
  const e = zip.entries[name]; if(!e) return null;
  const nlen = zip.dv.getUint16(e.lho + 26, true);
  const elen = zip.dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + elen;
  const raw = zip.u8.subarray(start, start + e.csize);
  if(e.method === 0) return new TextDecoder().decode(raw);
  if(e.method !== 8) throw new Error('unsupported_compression');
  if(typeof DecompressionStream === 'undefined') throw new Error('no_inflate');
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).text();
}

/* ---------------------------- xlsx ---------------------------- */
const XML = s => new DOMParser().parseFromString(s, 'application/xml');

function colToIndex(ref){
  let n = 0;
  for(const ch of ref){
    const c = ch.charCodeAt(0);
    if(c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}

/* Excel serial → ISO date. 1900 leap-year bug included, as Excel has it. */
function serialToISO(n){
  const ms = Math.round((n - 25569) * 86400000);
  const d = new Date(ms);
  if(isNaN(d)) return null;
  return d.toISOString().slice(0,10);
}

async function readWorkbook(file){
  const zip = await zipEntries(await file.arrayBuffer());

  /* shared strings */
  const ssXml = await zipRead(zip, 'xl/sharedStrings.xml');
  const shared = [];
  if(ssXml){
    for(const si of XML(ssXml).getElementsByTagName('si')){
      let t = '';
      for(const n of si.getElementsByTagName('t')) t += n.textContent;
      shared.push(t);
    }
  }

  /* which style indexes are dates */
  const stXml = await zipRead(zip, 'xl/styles.xml');
  const dateStyle = new Set();
  if(stXml){
    const st = XML(stXml);
    const custom = {};
    for(const f of st.getElementsByTagName('numFmt')){
      custom[f.getAttribute('numFmtId')] = f.getAttribute('formatCode') || '';
    }
    const builtinDate = new Set(['14','15','16','17','18','19','20','21','22','45','46','47']);
    const xfs = st.getElementsByTagName('cellXfs')[0];
    if(xfs){
      [...xfs.getElementsByTagName('xf')].forEach((xf, i) => {
        const id = xf.getAttribute('numFmtId') || '0';
        const code = custom[id];
        if(builtinDate.has(id) || (code && /[ymd]/i.test(code.replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,'')))) dateStyle.add(i);
      });
    }
  }

  /* sheet name → part name */
  const relXml = await zipRead(zip, 'xl/_rels/workbook.xml.rels');
  const rel = {};
  if(relXml) for(const r of XML(relXml).getElementsByTagName('Relationship')){
    rel[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\/?xl\//,'').replace(/^\//,'');
  }
  const wbXml = await zipRead(zip, 'xl/workbook.xml');
  if(!wbXml) throw new Error('not_xlsx');
  const sheets = {};
  for(const sh of XML(wbXml).getElementsByTagName('sheet')){
    const name = sh.getAttribute('name');
    const rid  = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const part = 'xl/' + (rel[rid] || ('worksheets/sheet' + sh.getAttribute('sheetId') + '.xml'));
    const xml = await zipRead(zip, part);
    if(!xml) continue;
    const grid = [];
    for(const row of XML(xml).getElementsByTagName('row')){
      const cells = [];
      for(const c of row.getElementsByTagName('c')){
        const ref = c.getAttribute('r') || '';
        const idx = colToIndex(ref.replace(/\d+/g,''));
        const t = c.getAttribute('t');
        let v = null;
        if(t === 'inlineStr'){
          v = ''; for(const n of c.getElementsByTagName('t')) v += n.textContent;
        } else {
          const vn = c.getElementsByTagName('v')[0];
          if(vn){
            if(t === 's') v = shared[Number(vn.textContent)];
            else if(t === 'str' || t === 'e') v = vn.textContent;
            else {
              const num = Number(vn.textContent);
              const s = Number(c.getAttribute('s') || 0);
              v = (dateStyle.has(s) && num > 20000 && num < 80000) ? serialToISO(num) : num;
            }
          }
        }
        if(idx >= 0) cells[idx] = (v === undefined ? null : v);
      }
      grid.push(cells);
    }
    sheets[name] = grid;
  }
  return sheets;
}

/* ---------------------------- Almaria rules ---------------------------- */
const IMP = {result:null, file:null};

const impText  = v => v === null || v === undefined ? '' : String(v).replace(/\s+/g,' ').trim();
const impUnit  = v => { const m = /BLOCK\s*([AB])\s*-?\s*(\d+)/i.exec(impText(v).replace(/ /g,' '));
                        return m ? m[1].toUpperCase() + '-' + String(Number(m[2])).padStart(3,'0') : null; };
const impNum   = v => { if(typeof v === 'number') return v;
                        const s = impText(v).replace(/[,\s]/g,'').replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
                        const n = Number(s); return isFinite(n) && s !== '' ? n : null; };

function impDate(v){
  if(v === null || v === undefined || v === '') return null;
  if(typeof v === 'number') return serialToISO(v);
  const s = impText(v);
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(s);              /* 15-9-2025 */
  if(m) return `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? null : d.toISOString().slice(0,10);
}

/* an instalment cell is "40,000" over "15-9-2025" on two lines */
function impInstalment(v){
  if(v === null || v === undefined || v === '') return null;
  const parts = String(v).split(/[\n\r]+/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length) return null;
  const amt = impNum(parts[0]);
  if(amt === null || amt === 0) return null;
  const due = parts.length > 1 ? impDate(parts.slice(1).join(' ')) : null;
  return {amt, due};
}

const ROOMS = s => { const t = impText(s);
  if(/3\s*غرف|ثلاث/.test(t)) return '3BR';
  if(/غرفتين|غرفتان/.test(t)) return '2BR';
  if(/غرفة/.test(t)) return '1BR';
  return null; };
const FLOOR = s => { const t = impText(s);
  if(/ارض|أرض/.test(t)) return 0;
  if(/الأول|الاول/.test(t)) return 1;
  if(/الثاني/.test(t)) return 2;
  if(/الثالث/.test(t)) return 3;
  const n = impNum(t); return n === null ? null : n; };

function findHeader(grid, needle){
  for(let i = 0; i < Math.min(grid.length, 20); i++){
    const row = grid[i] || [];
    for(let j = 0; j < row.length; j++) if(impText(row[j]).includes(needle)) return {row:i, col:j};
  }
  return null;
}
function headerMap(grid, hrow){
  const map = {}; const row = grid[hrow] || [];
  row.forEach((c, j) => { const t = impText(c); if(t) map[t] = j; });
  return map;
}
function impPick(map, ...needles){
  for(const n of needles){
    for(const k in map) if(k.includes(n)) return map[k];
  }
  return null;
}

function parseRegister(sheets){
  const warn = [];
  const names = Object.keys(sheets);
  const main = names.find(n => n.includes('المجمع')) || names.find(n => findHeader(sheets[n],'رقم الشقة') && findHeader(sheets[n],'قيمة العقد'));
  if(!main) throw new Error('no_register_sheet');
  const grid = sheets[main];
  const h = findHeader(grid, 'رقم الشقة');
  if(!h) throw new Error('no_header');
  const map = headerMap(grid, h.row);

  const cUnit  = impPick(map,'رقم الشقة');
  const cRooms = impPick(map,'الغرف');
  const cName  = impPick(map,'اسم المستأجر');
  const cStart = impPick(map,'تاريخ بدايه','تاريخ بداية');
  const cValue = impPick(map,'قيمة العقد');
  const cEnd   = impPick(map,'تاريخ نهاية');
  const cPaid  = impPick(map,'إجمالي الدفع','اجمالي الدفع');
  const cRem   = impPick(map,'المتبقي');
  const inst   = Object.keys(map).filter(k => /^الدفعة/.test(k))
                   .sort((a,b) => map[a] - map[b]).map(k => map[k]);
  if(cUnit === null || cValue === null) throw new Error('columns_not_found');
  if(!inst.length) warn.push({t:'No instalment columns found — payment schedules will be empty'});

  /* areas and floors */
  const areaSheet = names.find(n => n.includes('المساحات'));
  const geo = {};
  if(areaSheet){
    const g = sheets[areaSheet], gh = findHeader(g,'رقم الشقة');
    if(gh){
      const gm = headerMap(g, gh.row);
      const gu = impPick(gm,'رقم الشقة'), ga = impPick(gm,'مساحة'), gf = impPick(gm,'الطابق'), gr = impPick(gm,'الغرف'), gv = impPick(gm,'قيمة العقد');
      for(let i = gh.row + 1; i < g.length; i++){
        const r = g[i] || [], u = impUnit(r[gu]); if(!u) continue;
        geo[u] = {area: ga !== null ? impNum(r[ga]) : null,
                  floor: gf !== null ? FLOOR(r[gf]) : null,
                  type: gr !== null ? ROOMS(r[gr]) : null,
                  value: gv !== null ? impNum(r[gv]) : null};
      }
    }
  } else warn.push({t:'Sheet المساحات والقيمة not found — areas and floors kept from the current register'});

  /* one row per apartment: prefer a row that is let, named and priced */
  const best = {};
  for(let i = h.row + 1; i < grid.length; i++){
    const r = grid[i] || [];
    const u = impUnit(r[cUnit]); if(!u) continue;
    const joined = r.map(impText).join(' ');
    const isLet  = /(^|\s)مؤجرة/.test(joined) && !/غير\s*مؤجرة/.test(joined);
    const name   = cName !== null ? impText(r[cName]) : '';
    const value  = cValue !== null ? impNum(r[cValue]) : null;
    const score  = (isLet ? 2 : 0) + (name ? 1 : 0) + (value ? 1 : 0);
    if(!best[u] || score > best[u].score) best[u] = {r, score, isLet, name, value, row: i + 1};
  }

  const dupes = Object.values(best).filter(b => b.score < 4 && b.isLet).length;
  const rowCount = Object.keys(best).length;

  const out = [];
  Object.keys(best).sort((a,b)=>a.localeCompare(b,'en',{numeric:true})).forEach(u => {
    const b = best[u], r = b.r, g = geo[u] || {};
    const paidTotal = cPaid !== null ? impNum(r[cPaid]) : null;

    let rows = inst.map(ci => impInstalment(r[ci])).filter(Boolean)
                   .map((x, i) => ({n: i + 1, amt: x.amt, due: x.due, paid: false}));
    /* the sheet records one collected total, not a paid flag per line:
       fill from the earliest instalment until that total is used up */
    if(paidTotal){
      let left = paidTotal;
      for(const x of rows){
        const tol = Math.max(5, x.amt * 0.01);       /* under 1% short is a rounding gap */
        if(left >= x.amt - tol){
          x.paid = true;
          if(left < x.amt) warn.push({u, t:`instalment ${x.n} treated as received although the collected total is ${Math.round(x.amt-left).toLocaleString()} SAR short of it`});
          left -= x.amt;
        } else break;
      }
    }

    const lineTotal = rows.reduce((a,x)=>a+x.amt,0);
    if(b.isLet && b.value && rows.length && Math.abs(lineTotal - b.value) > 1)
      warn.push({u, t:`instalment lines total ${Math.round(lineTotal).toLocaleString()} against a contract value of ${Math.round(b.value).toLocaleString()}`});
    if(g.value && b.value && Math.round(g.value) !== Math.round(b.value))
      warn.push({u, t:`contract value differs between sheets — ${Math.round(b.value).toLocaleString()} here, ${Math.round(g.value).toLocaleString()} on المساحات والقيمة`});
    if(!b.isLet && b.value)
      warn.push({u, t:'recorded as vacant but still carries a contract value'});
    if(!b.isLet && b.name)
      warn.push({u, t:'recorded as vacant but carries a tenant name'});
    const end = cEnd !== null ? impDate(r[cEnd]) : null;
    if(b.isLet) rows.forEach(x => { if(end && x.due && x.due > end)
      warn.push({u, t:`an instalment is dated ${x.due}, after the lease ends on ${end}`}); });

    if(!b.isLet && rows.length){
      warn.push({u, t:`a payment schedule of ${rows.length} instalments is attached to an apartment recorded as vacant — not carried into the register`});
      rows = [];
    }
    out.push({
      id: u,
      type: g.type || (cRooms !== null ? ROOMS(r[cRooms]) : null) || '—',
      area: g.area || null,
      floor: g.floor === null || g.floor === undefined ? 0 : g.floor,
      let: b.isLet,
      tenant: b.isLet ? (b.name || null) : null,
      tenantAr: b.isLet ? (b.name || null) : null,
      value: b.value || null,
      start: cStart !== null ? impDate(r[cStart]) : null,
      end,
      paid: b.isLet ? paidTotal : null,
      remain: b.isLet ? (cRem !== null ? impNum(r[cRem]) : null) : null,
      inst: rows
    });
  });

  /* the collections sheet, when the workbook carries one, is authoritative
     for what is outstanding */
  const arrSheet = names.find(n => n.includes('متأخرات'));
  const arrears = [];
  if(arrSheet){
    const g = sheets[arrSheet], gh = findHeader(g,'رقم الشقة');
    if(gh){
      const gm = headerMap(g, gh.row);
      const gu = impPick(gm,'رقم الشقة'), gamt = impPick(gm,'المبلغ'), gdue = impPick(gm,'تاريخ الاستحقاق');
      for(let i = gh.row + 1; i < g.length; i++){
        const r = g[i] || [];
        let u = impUnit(r[gu]);
        if(!u){                                  /* the collections sheet often uses a bare number */
          const n = impNum(r[gu]);
          if(n !== null) u = out.find(x => Number(x.id.split('-')[1]) === n)?.id || null;
        }
        if(!u) continue;
        const amt = gamt !== null ? impNum(r[gamt]) : null;
        if(!amt) continue;
        arrears.push({u, amt, due: gdue !== null ? impDate(r[gdue]) : null});
      }
    }
  }

  if(!arrSheet) warn.push({t:'This workbook has no متأخرات التحصيل sheet. Arrears will be derived from the payment schedule alone, so any instalment carrying a wrong year will not appear as overdue. Include the collections sheet in the file to have arrears checked against it.'});

  return {rows: out, warn, arrears, sheet: main, rowCount, dupes,
          sheetNames: names, geoSheet: areaSheet || null, arrSheet: arrSheet || null};
}

/* ---------------------------- figures ---------------------------- */
function regFigures(rows){
  const today = TODAY;
  let f = {units: rows.length, let: 0, contracted: 0, billed: 0, collected: 0, arrears: 0, arrUnits: 0};
  rows.forEach(r => {
    if(!r.let) return;                    /* vacant apartments are outside every rent figure */
    f.let++; f.contracted += r.value || 0;
    let a = 0;
    (r.inst || []).forEach(x => {
      const due = x.due ? new Date(x.due) : null;
      const billed = due ? due <= today : false;
      if(billed) f.billed += x.amt;
      if(x.paid) f.collected += x.amt;
      if(billed && !x.paid) a += x.amt;
    });
    if(a > 0){ f.arrears += a; f.arrUnits++; }
  });
  return f;
}

async function importRun(input){
  const file = input.files && input.files[0];
  if(!file) return;
  $('impBusy').style.display = 'block';
  $('impOut').innerHTML = '';
  try{
    const sheets = await readWorkbook(file);
    const res = parseRegister(sheets);
    if(!res.rows.length) throw new Error('no_units');
    IMP.result = res; IMP.file = file.name;
    $('impBusy').style.display = 'none';
    $('impOut').innerHTML = importPreviewHtml(res);
  }catch(err){
    $('impBusy').style.display = 'none';
    const key = {not_zip:'imp_e_zip', not_xlsx:'imp_e_zip', no_inflate:'imp_e_browser',
                 no_register_sheet:'imp_e_sheet', no_header:'imp_e_sheet',
                 columns_not_found:'imp_e_cols', no_units:'imp_e_units'}[err.message] || 'imp_e_other';

}

function importApply(){

  applyRegister(res.rows);

/* rebuild every unit from a register, in place, then recompute everything */
function applyRegister(rows){
  const built = rows.map(r => ({
    u:r.id, floor:r.floor, type:r.type, area:r.area,
    occupied:r.let, tenant:r.tenant, tenant_ar:r.tenantAr,
    rent:r.value||0, leaseStart:r.start?new Date(r.start):null, leaseEnd:r.end?new Date(r.end):null,
    inst:(r.inst||[]).map(x=>({q:x.n, amt:x.amt, due:x.due?new Date(x.due):null,
          billed: x.due? new Date(x.due)<=TODAY : false, paid:x.paid,
          paidOn: x.paid && x.due ? new Date(x.due) : null})),
    sheetPaid:r.paid, sheetRemain:r.remain
  }));
  const keep = {};
  UNITS.forEach(u => keep[u.u] = {account:u.account, lastSeen:u.lastSeen, prefers:u.prefers});
  UNITS.length = 0;
  built.forEach((u,i) => {
    const k = keep[u.u] || {};
    u.account = k.account || 'none';
    u.lastSeen = k.lastSeen ?? null;
    u.prefers = k.prefers || null;
    u.profile = 'good';
    UNITS.push(u);
  });
  UNITS.forEach(u => {
    if(!u.occupied) return;
    const unpaidBilled = u.inst.filter(x => x.billed && !x.paid);
    u.profile = !unpaidBilled.length ? 'good'
      : (Math.max(...unpaidBilled.map(x => (TODAY - x.due)/864e5)) > 60 ? 'problem' : 'late');
  });
  recompute();
}

/* grouped bars, 2 series */
function chartFlow(){
 const W=640,H=210,PL=48,PR=12,PT=14,PB=26;
 /* round up to a multiple of 8 so the four gridline labels are whole numbers */
 const max=Math.max(8, Math.ceil(Math.max(0,...byMonth.map(m=>Math.max(m.raised,m.closed)))/8)*8);
 const iw=W-PL-PR, ih=H-PT-PB, bw=iw/byMonth.length;
 const bar=(bw-10)/2-1;
 let g='';
 for(let t=0;t<=max;t+=max/4){
  const y=PT+ih-(t/max)*ih;
  g+=`<line x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${NUM(t)}</text>`;
 }
 let b='';
 byMonth.forEach((m,i)=>{
  const x0=PL+i*bw+5;
  [['raised',m.raised,0],['closed',m.closed,1]].forEach(([k,v,si])=>{
   const h=(v/max)*ih, x=x0+si*(bar+2), y=PT+ih-h;
   b+=`<rect x="${x}" y="${y}" width="${bar}" height="${h}" rx="4" fill="${SER[si]}"
        class="hb" data-i="${i}" data-k="${k}"/>`;
  });
  b+=`<text x="${x0+bar+1}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${L(m.en,m.ar)}</text>`;
 });
 /* selective direct labels: latest month only */
 const lm=byMonth[5], x0=PL+5*bw+5;

/* single line + target */
function chartSla(){
 const W=640,H=200,PL=48,PR=40,PT=16,PB=26;
 const iw=W-PL-PR, ih=H-PT-PB;
 const yv=v=>PT+ih-((v-60)/40)*ih;
 const xv=i=>PL+ (iw/(byMonth.length-1))*i;
 let g='';
 [60,70,80,90,100].forEach(t=>{
  const y=yv(t);
  g+=`<line x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${NUM(t)}%</text>`;
 });
 const ty=yv(90);
 g+=`<line x1="${PL}" x2="${W-PR}" y1="${ty}" y2="${ty}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>
     <text x="${W-PR+4}" y="${ty+4}" font-size="10.5" font-weight="700" fill="var(--good)">${T('target')}</text>`;
 /* a month with nothing measurable is a gap in the line, not a zero */
 const seg=[]; let run=[];
 byMonth.forEach((m,i)=>{ if(m.sla==null){ if(run.length>1) seg.push(run); run=[]; }
                          else run.push(`${xv(i)},${yv(m.sla)}`); });
 if(run.length>1) seg.push(run);
 let d=seg.map(r=>`<polyline points="${r.join(' ')}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
 byMonth.forEach((m,i)=>{
  if(m.sla!=null) d+=`<circle cx="${xv(i)}" cy="${yv(m.sla)}" r="4.5" fill="var(--series-1)" stroke="var(--surface)" stroke-width="2" class="hp" data-i="${i}"/>`;
  d+=`<text x="${xv(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${L(m.en,m.ar)}</text>`;
 });
 const lastMeasured=[...byMonth].reverse().find(m=>m.sla!=null);
 if(byMonth[5].sla!=null)
   d+=`<text x="${xv(5)}" y="${yv(byMonth[5].sla)-12}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${NUM(byMonth[5].sla)}%</text>`;
 else if(!lastMeasured)
   d+=`<text x="${PL+iw/2}" y="${PT+ih/2}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">${T('nolog_sla')}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${d}</svg>`;
}

/* build the work order; shared by the form and by the shared-record replay */
function logJobAdd(rec, u, d){
  const seq = WOS.length + 1;
  const id = rec.id || ('MR-' + String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + '-I' + String(seq).padStart(3,'0'));
  if(WOS.some(w=>w.id===id)) return id;
  WOS.unshift({
    id, cat: rec.cat, unit: rec.unit,
    tenant: (u&&u.tenant)||'—', tenant_ar: (u&&u.tenant_ar)||'—',
    desc: rec.desc, pri:'med', ch:'desk', raised: d,
    respH: 0, closeH: 0, target: 0, breached: false, noSla: true,
    status: 'done', tech: rec.supplier || '—', tech_ar: rec.supplier || '—',
    supplier: !!rec.supplier, labH: rec.labH, mat: rec.mat, rating: null,
    invoice: rec.inv || null,
    month: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
  });
  WOS.sort((a,b)=>b.raised-a.raised);
  /* a supplier exists once a job names it */
  if(rec.supplier && !SUPPLIERS.some(x=>x.n===rec.supplier)){
    SUPPLIERS.push({n:rec.supplier, ar:rec.supplier, tr:'—', tr_ar:'—',
                    resp:null, rew:null, rate:null, to:'—'});
  }
  return id;
}

let WF={q:'',status:'open',cat:'all',pri:'all'};
function woFiltered(){

  if(WF.status==='open'&&!['submitted','assigned','progress','hold'].includes(w.status))return false;
  if(WF.status==='breach'&&!(['submitted','assigned','progress','hold'].includes(w.status)&&ageH(w)>w.target))return false;
  if(WF.status==='urgent'&&!(w.pri==='high'&&['submitted','assigned','progress','hold'].includes(w.status)))return false;
  if(WF.cat!=='all'&&w.cat!==WF.cat)return false;
  if(WF.q){const q=WF.q.toLowerCase();
   if(!(w.id.toLowerCase().includes(q)||String(w.unit).includes(q)||w.desc.toLowerCase().includes(q)))return false;}
  return true;
 });
}

/* record an instalment as received; the resident's schedule flips to Paid */
function recordPayment(unit, q){
 const u = UNITS.find(x=>x.u===unit); if(!u) return;
 const row = (u.inst||[]).find(x=>x.q===q); if(!row || row.paid) return;
 const d = new Date();
 const ref = 'RCT-'+String(d.getFullYear()).slice(2)+'-'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
 row.paid = true; row.paidOn = d; row.ref = ref;
 LINK.commit(s=>{
   s.pay[unit] = s.pay[unit] || {paid:{}};
   s.pay[unit].paid[q] = {ref, on:d.toISOString()};
 }, 'console');
 recompute(); closeDrawer(); render();
 const early = row.due && row.due > TODAY;
 toast(early
  ? L('Advance payment recorded — receipt '+ref+' is now on the resident\'s schedule.',
      'تم تسجيل دفعة مقدّمة — الإيصال '+ref+' ظاهر الآن في جدول الساكن.')
  : L('Payment recorded — receipt '+ref+' is now on the resident\'s schedule.',
      'تم تسجيل الدفعة — الإيصال '+ref+' ظاهر الآن في جدول الساكن.'));
}

let COSTVIEW='chart';

/* ==========================================================================
   REPORT LIBRARY

   Every report is a function returning one shape — columns, rows, totals and
   a note — so the renderer, the CSV export and the print view are written
   once and each report only has to describe its own data.

   Each carries a readiness state, and it is honest rather than decorative:

     ready    the data exists today, the report produces real output
     filling  the report works, but is only as complete as the log so far
     blocked  a module that does not exist yet has to be built first

   A report that cannot be produced says what is missing instead of showing
   an empty table that looks like a system failure.
   ========================================================================== */

/* twelve months of instalments, so the office can see what is due before it is due */
function repForecast(){
  const buckets = [];
  const start = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  for(let i=0;i<12;i++){
    const d = new Date(start); d.setMonth(d.getMonth()+i);
    buckets.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), d, due:0, paid:0, n:0, units:new Set()});
  }
  let overdue = 0, overdueN = 0;
  UNITS.forEach(u=>{
    if(!u.occupied) return;
    u.inst.forEach(x=>{
      if(!x.due) return;
      if(x.billed && !x.paid){ overdue += x.amt; overdueN++; return; }
      const k = x.due.getFullYear()+'-'+String(x.due.getMonth()+1).padStart(2,'0');
      const b = buckets.find(y=>y.key===k);
      if(!b) return;
      b.due += x.amt; b.n++; b.units.add(u.u);
      if(x.paid) b.paid += x.amt;
    });
  });
  const rows = buckets.map(b=>({
    month: b.d, n:b.n, units:b.units.size, due:b.due, paid:b.paid, expect:b.due-b.paid
  }));
  return {
    stats:[[T('rp_overdue_now'), money(overdue), NUM(overdueN)+' '+L('instalments','دفعات')],

function repOccupancy(){

/* the CEO's ask: what came in, what went out, and what it did to contracted rent */
function repMovement(){
  const r = rpRange();

    dir:T('rp_in'), unit:u.u, tenant:L(u.tenant,u.tenant_ar), type:u.type, area:u.area,
    date:u.leaseStart, value:u.rent, m2:m2(u)
  }));
  const out = UNITS.filter(u=>u.leaseEnd && rpIn(u.leaseEnd, r) && u.leaseEnd < TODAY).map(u=>({

function repRate(){
  const byType = {};
  UNITS.filter(u=>u.occupied && u.area && u.rent).forEach(u=>{
    const k=u.type||'—';
    byType[k]=byType[k]||{k,list:[]};
    byType[k].list.push({u, r:u.rent/u.area});
  });
  const rows = Object.values(byType).sort((a,b)=>a.k.localeCompare(b.k)).map(b=>{
    const rates=b.list.map(x=>x.r).sort((x,y)=>x-y);
    const lo=b.list.reduce((m,x)=>x.r<m.r?x:m), hi=b.list.reduce((m,x)=>x.r>m.r?x:m);
    return {type:b.k, n:b.list.length,
      avgArea: Math.round(b.list.reduce((a,x)=>a+x.u.area,0)/b.list.length),
      avg: rates.reduce((a,x)=>a+x,0)/rates.length,
      min: rates[0], minU: lo.u.u, max: rates[rates.length-1], maxU: hi.u.u,
      spread: rates[rates.length-1]-rates[0]};
  });
  return {
    cols:[{k:'type',l:T('type')},{k:'n',l:T('rp_apartments'),num:1},{k:'avgArea',l:T('rp_avgarea'),num:1},
          {k:'avg',l:T('rp_avgm2'),num:1,dec:1},{k:'min',l:T('rp_lowest'),num:1,dec:1},
          {k:'minU',l:T('unit')},{k:'max',l:T('rp_highest'),num:1,dec:1},{k:'maxU',l:T('unit')},
          {k:'spread',l:T('rp_spread'),num:1,dec:1}],
    rows,
    note:T('rp_rate_n')
  };
}

/* the data-quality note, run live against whatever register is loaded */
function repQuality(){
  const rows=[];
  const add=(u,sev,t)=>rows.push({unit:u||'—', severity:sev, finding:t});
  UNITS.forEach(u=>{
    const lines=(u.inst||[]).reduce((a,x)=>a+x.amt,0);
    if(u.occupied && u.inst.length && u.rent && Math.abs(lines-u.rent)>1)
      add(u.u, T('rp_sev_med'), T('rp_q_lines').replace('{a}',money(lines)).replace('{b}',money(u.rent)));
    if(!u.occupied && u.rent) add(u.u, T('rp_sev_med'), T('rp_q_vacantvalue'));
    if(u.occupied && !u.inst.length) add(u.u, T('rp_sev_high'), T('rp_q_nosched'));
    if(u.occupied && u.leaseEnd) (u.inst||[]).forEach(x=>{
      if(x.due && x.due > u.leaseEnd)
        add(u.u, T('rp_sev_high'), T('rp_q_pastend').replace('{d}',fmtD(x.due)).replace('{e}',fmtD(u.leaseEnd)));
    });
    if(u.occupied && u.leaseEnd && u.leaseEnd < TODAY)
      add(u.u, T('rp_sev_high'), T('rp_q_expired').replace('{d}',fmtD(u.leaseEnd)));
    if(u.area && u.type==='2BR' && u.area<60) add(u.u, T('rp_sev_low'), T('rp_q_area').replace('{a}',NUM(u.area)).replace('{t}',u.type));
    if(u.area && u.type==='3BR' && u.area<90) add(u.u, T('rp_sev_low'), T('rp_q_area').replace('{a}',NUM(u.area)).replace('{t}',u.type));
    if(u.occupied && !u.rent) add(u.u, T('rp_sev_high'), T('rp_q_novalue'));
  });
  rows.sort((a,b)=>a.unit.localeCompare(b.unit,'en',{numeric:true}));
  const sev = s => rows.filter(r=>r.severity===s).length;
  return {
    stats:[[T('rp_findings'), NUM(rows.length), T('rp_q_d')],
           [T('rp_sev_high'), NUM(sev(T('rp_sev_high'))), T('rp_q_high_d')],
           [T('rp_apartments'), NUM(new Set(rows.map(r=>r.unit)).size), T('rp_q_units_d')]],
    cols:[{k:'unit',l:T('unit')},{k:'severity',l:T('rp_severity')},{k:'finding',l:T('rp_finding')}],
    rows,
    note:T('rp_q_n')
  };
}

function repSupplier(){
  const jobs = rpJobsIn().filter(w=>w.status==='done');
  const by = {};
  jobs.forEach(w=>{
    const k = w.tech && w.tech!=='—' ? w.tech : T('rp_unassigned');
    by[k]=by[k]||{k,n:0,c:0,rated:[],sla:[]};
    by[k].n++; by[k].c+=woCost(w);
    if(w.rating) by[k].rated.push(w.rating);
    if(!w.noSla) by[k].sla.push(isBreached(w)?0:1);

  const rows = Object.values(by).sort((a,b)=>b.c-a.c).map(b=>({
    who:b.k, jobs:b.n, cost:b.c, avg:Math.round(b.c/b.n),

    sla: b.sla.length? Math.round(b.sla.reduce((a,x)=>a+x,0)/b.sla.length*100) : null,
    measured: b.sla.length
  }));
  return {
    period:true, filling:true,
    stats:[[T('rp_suppliers'), NUM(rows.length), rpPeriodLabel()],

function repSla(){
  const jobs = rpJobsIn().filter(w=>!w.noSla && w.status!=='cancelled');
  const rows = CATS.map(c=>{
    const mine = jobs.filter(w=>w.cat===c.id);
    if(!mine.length) return null;
    const met = mine.filter(w=>!isBreached(w)).length;
    return {service:catName(c), target:c.sla, jobs:mine.length, met,
            missed:mine.length-met, pct:Math.round(met/mine.length*100)};
  }).filter(Boolean).sort((a,b)=>a.pct-b.pct);
  const all = jobs.length, met = jobs.filter(w=>!isBreached(w)).length;
  const excluded = rpJobsIn().filter(w=>w.noSla).length;
  return {
    period:true, filling:true,
    stats:[[T('st_sla'), all?NUM(Math.round(met/all*100))+'%':'—', NUM(all)+' '+T('rp_measurable')],
           [T('rp_missed'), NUM(all-met), T('rp_missed_d')],
           [T('rp_excluded'), NUM(excluded), T('rp_excluded_d')]],
    cols:[{k:'service',l:T('log_cat')},{k:'target',l:T('targetc'),num:1},
          {k:'jobs',l:T('rp_measurable'),num:1},{k:'met',l:T('rp_met'),num:1},

    rows,
    foot:{service:T('rp_total'), jobs:all, met, missed:all-met, pct:all?Math.round(met/all*100):null},
    note:T('rp_sla_n')
  };
}

function repRecurring(){
  const done = WOS.filter(w=>w.status!=='cancelled');
  const by = {};
  done.forEach(w=>{ const k=w.unit+'|'+w.cat; by[k]=by[k]||{unit:w.unit,cat:w.cat,n:0,c:0,last:null};
    by[k].n++; by[k].c+=w.status==='done'?woCost(w):0;
    if(!by[k].last || w.raised>by[k].last) by[k].last=w.raised; });
  const rows = Object.values(by).filter(x=>x.n>1).sort((a,b)=>b.n-a.n||b.c-a.c).map(x=>({
    unit:x.unit, service:catName(CAT(x.cat)), times:x.n, cost:x.c, last:x.last

  return {
    filling:true,

    note:T('rp_recur_n')
  };
}

/* ==========================================================================
   EVIDENCE

   Every figure in this console should be traceable to the document it came
   from. This module attaches documents to leases, instalments and jobs,
   fingerprints each one so a later edit or swap is detectable, reads what it
   can out of digital PDFs, and reports on what is still unevidenced.

   Storage is deliberately separated from evidence. Today only the evidence
   record is kept — name, type, size, SHA-256, when and by whom. The file
   itself is not stored, because a browser cannot hold 37 contracts. When the
   Supabase bucket exists, DOCSTORE.put() uploads and returns a path, and
   nothing else in this file changes.
   ========================================================================== */

const DOCKINDS = ['contract','receipt','invoice','other'];

const DOCSTORE = {
  mode: 'fingerprint',                 /* becomes 'supabase' once a bucket exists */
  async put(file){ return {mode:'fingerprint', path:null}; }
};

/* SHA-256 where the browser allows it; a weaker rolling fingerprint where it
   does not, labelled as such rather than passed off as the same thing. */
async function docFingerprint(buf){
  try{
    if(crypto && crypto.subtle && crypto.subtle.digest){
      const h = await crypto.subtle.digest('SHA-256', buf);
      return {algo:'SHA-256', hex:[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')};
    }
  }catch(e){}
  const u = new Uint8Array(buf);
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for(let i=0;i<u.length;i++){
    h1 = ((h1 ^ u[i]) * 16777619) >>> 0;
    h2 = ((h2 + u[i]) * 31 + i) >>> 0;
  }
  return {algo:'weak', hex:(h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0'))};
}

/* ------------------------------ PDF text ------------------------------ */
/* Digital PDFs carry a text layer. Scans do not — they carry an image, and
   nothing in a browser can read those, so we say so rather than guess. */
async function pdfText(buf){
  const u = new Uint8Array(buf);
  const head = new TextDecoder('latin1').decode(u.subarray(0, 8));
  if(!head.startsWith('%PDF')) return {ok:false, why:'not_pdf', text:''};
  const raw = new TextDecoder('latin1').decode(u);
  let text = '';
  const re = /stream\r?\n?/g;
  let m;
  while((m = re.exec(raw))){
    if(raw.substr(m.index-3,3) === 'end') continue;      /* this is an endstream */
    const dictStart = raw.lastIndexOf('<<', m.index);
    const dict = dictStart >= 0 ? raw.slice(dictStart, m.index) : '';
    const end = raw.indexOf('endstream', m.index);
    if(end < 0) continue;
    const start = m.index + m[0].length;
    /* the dictionary states the exact length; without it, trim the newline the
       writer puts before endstream. A single trailing byte makes the inflater
       reject the whole stream. */
    const lenM = /\/Length\s+(\d+)/.exec(dict);
    let stop = lenM ? Math.min(start + Number(lenM[1]), end) : end;
    while(!lenM && stop > start && (u[stop-1]===10 || u[stop-1]===13)) stop--;
    let bytes = u.subarray(start, stop);
    if(/FlateDecode/.test(dict)){
      try{
        const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
        bytes = new Uint8Array(await new Response(s).arrayBuffer());
      }catch(e){ continue; }
    } else if(/DCTDecode|JPXDecode|CCITTFaxDecode|JBIG2Decode/.test(dict)){
      continue;                                  /* an image — a scanned page */
    }
    const page = new TextDecoder('latin1').decode(bytes);
    /* text-showing operators */
    page.replace(/\((?:\\.|[^\\()])*\)\s*Tj/g, s => { text += pdfLit(s) + ' '; return s; });
    page.replace(/\[((?:[^\[\]]|\\.)*)\]\s*TJ/g, (s,inner) => {
      inner.replace(/\((?:\\.|[^\\()])*\)/g, t => { text += pdfLit(t); return t; });
      text += ' '; return s;
    });
    page.replace(/<([0-9A-Fa-f\s]+)>\s*Tj/g, (s,hex) => { text += pdfHex(hex) + ' '; return s; });
    if(text.length > 400000) break;
  }
  text = text.replace(/\s+/g,' ').trim();
  return {ok: text.length > 20, why: text.length > 20 ? null : 'no_text_layer', text};
}
const pdfLit = s => s.replace(/^\(|\)\s*Tj$|\)$/g,'')
  .replace(/\\([nrtbf()\\])/g, (m,c)=>({n:'\n',r:'',t:' ',b:'',f:''}[c] ?? c))
  .replace(/\\([0-7]{1,3})/g, (m,o)=>String.fromCharCode(parseInt(o,8)));
const pdfHex = h => {
  const s = h.replace(/\s/g,'');
  let out = '';
  for(let i=0;i+3<s.length;i+=4){
    const c = parseInt(s.substr(i,4),16);
    if(c >= 32) out += String.fromCharCode(c);
  }
  if(!out) for(let i=0;i+1<s.length;i+=2){
    const c = parseInt(s.substr(i,2),16);
    if(c >= 32) out += String.fromCharCode(c);
  }
  return out;
};

/* ------------------------- candidates from text ------------------------- */
/* Proposals only. Nothing reaches the register until a person confirms it. */
function docCandidates(text){
  const out = {dates:[], amounts:[], contractNo:null};
  const seen = new Set();

  const push = (y,mo,d) => {
    if(y<2000||y>2100||mo<1||mo>12||d<1||d>31) return;
    const iso = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(!seen.has(iso)){ seen.add(iso); out.dates.push(iso); }
  };
  (text.match(/\b(\d{4})[-/](\d{1,2})[-/](\d{1,2})\b/g)||[]).forEach(s=>{
    const p=s.split(/[-/]/); push(+p[0],+p[1],+p[2]);
  });
  (text.match(/\b(\d{1,2})[-/](\d{1,2})[-/](\d{4})\b/g)||[]).forEach(s=>{
    const p=s.split(/[-/]/); push(+p[2],+p[1],+p[0]);
  });
  out.dates.sort();

  /* amounts: keep anything that reads like money and is plausible as rent */
  const amt = new Set();
  (text.match(/\b\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\b/g)||[]).forEach(s=>amt.add(Number(s.replace(/,/g,''))));
  (text.match(/\b\d{4,7}(?:\.\d{1,2})?\b/g)||[]).forEach(s=>{
    const n=Number(s);
    /* a bare 10-digit run is an identity number, not money — never captured.
       A bare four digits in the 1900–2100 range is a year, not a rent. */
    if(s.replace('.','').length<=7 && n>=1000 && n<=5000000 && !(n>=1900 && n<=2100)) amt.add(n);
  });
  out.amounts = [...amt].filter(n=>n>=1000).sort((a,b)=>b-a).slice(0,12);

  const cn = text.match(/\b\d{10,14}\b/);
  out.contractNo = cn ? cn[0] : null;
  /* a national ID is a 10-digit number starting 1 or 2 — deliberately dropped */
  if(out.contractNo && /^[12]\d{9}$/.test(out.contractNo)) out.contractNo = null;
  return out;
}

/* ------------------------------ the store ------------------------------ */
const docKey = r => r.type==='unit' ? 'u:'+r.unit
                  : r.type==='inst' ? 'i:'+r.unit+':'+r.inst
                  : 'w:'+r.wo;
const docsFor = r => (LINK.get().docs||[]).filter(d=>d.key===docKey(r));
const docCount = r => docsFor(r).length;

async function docAttach(file, ref, kind){
  const buf = await file.arrayBuffer();
  const fp  = await docFingerprint(buf);
  const put = await DOCSTORE.put(file);
  let read = {ok:false, why:'not_pdf', text:''};
  if(/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)){
    try{ read = await pdfText(buf); }catch(e){ read = {ok:false, why:'unreadable', text:''}; }
  }
  const rec = {
    id: 'D-' + fp.hex.slice(0,12),
    key: docKey(ref), ref, kind,
    name: file.name, mime: file.type||'', size: file.size,
    algo: fp.algo, hash: fp.hex,
    at: new Date().toISOString(), by: T('who'),
    readable: read.ok, why: read.why,
    storage: put.mode, path: put.path
  };
  const dup = (LINK.get().docs||[]).find(d=>d.hash===rec.hash);
  LINK.commit(s=>{
    s.docs = s.docs || [];
    if(!s.docs.some(d=>d.id===rec.id && d.key===rec.key)) s.docs.push(rec);
  }, 'console');
  return {rec, read, dup: dup && dup.key!==rec.key ? dup : null};
}

function docRemove(id, key){
  LINK.commit(s=>{ s.docs = (s.docs||[]).filter(d=>!(d.id===id && d.key===key)); }, 'console');
  recompute(); render();
}

async function docRun(input){
  const file = input.files && input.files[0]; if(!file || !DOCCTX) return;
  $('dBusy').style.display='block'; $('dOut').innerHTML='';
  try{
    const kind = $('dKind').value;
    const {rec, read, dup} = await docAttach(file, DOCCTX.ref, kind);
    $('dBusy').style.display='none';
    $('dOut').innerHTML = docResultHtml(rec, read, dup);
    recompute();
  }catch(e){
    $('dBusy').style.display='none';
    $('dOut').innerHTML = `<div class="card"><div class="bd"><div class="warnbox">${I('alert',16,2.2)}<span>${e.message}</span></div></div></div>`;
  }
}

/* a confirmed contract writes the lease terms, and says what it changed */
function docApplyLease(){
  const u = UNITS.find(x=>x.u===DOCCTX.ref.unit); if(!u) return;
  const start = $('dStart').value, end = $('dEnd').value;
  const value = Number($('dValue').value)||0, n = Number($('dInst').value)||0;
  if(!start && !end && !value){ toast(T('doc_need')); return; }
  const was = {start:u.leaseStart, end:u.leaseEnd, rent:u.rent, inst:u.inst.length};
  if(start) u.leaseStart = new Date(start);
  if(end)   u.leaseEnd   = new Date(end);
  if(value) u.rent = value;
  if(value && n && start){
    const rows=[]; let left=value;
    for(let i=0;i<n;i++){
      const d=new Date(start); d.setMonth(d.getMonth()+i);
      const amt = i===n-1 ? left : Math.round(value/n);
      left -= amt;
      rows.push({q:i+1, amt, due:d, billed:d<=TODAY, paid:false, paidOn:null});
    }
    u.inst = rows;
  }
  if(!u.occupied && (value||start)) u.occupied = true;
  LINK.commit(s=>{
    s.leases = s.leases || {};
    s.leases[u.u] = {start: start||null, end: end||null, value: value||null, n: n||null,
                     doc: DOCCTX.rec.id, at: new Date().toISOString()};
  }, 'console');
  recompute(); closeDrawer(); render();
  toast(T('doc_applied').replace('{u}', u.u)
    + (was.rent!==u.rent ? ' ' + money(was.rent) + ' → ' + money(u.rent) : ''));
}

/* a confirmed receipt settles the instalment it is attached to */
function docApplyReceipt(){
  const r = DOCCTX.ref;
  const u = UNITS.find(x=>x.u===r.unit); if(!u) return;
  const row = u.inst.find(x=>x.q===r.inst); if(!row) return;
  const amt = Number($('dAmt').value)||0;
  const on  = $('dPaidOn').value;
  if(Math.abs(amt - row.amt) > 1 && amt)
    toast(T('doc_amtdiff').replace('{a}',money(amt)).replace('{b}',money(row.amt)));
  const ref = 'RCT-' + DOCCTX.rec.hash.slice(0,6).toUpperCase();
  row.paid = true; row.paidOn = on ? new Date(on) : TODAY; row.ref = ref;
  LINK.commit(s=>{
    s.pay = s.pay || {};
    s.pay[r.unit] = s.pay[r.unit] || {paid:{}};
    s.pay[r.unit].paid[r.inst] = {ref, on:(on?new Date(on):TODAY).toISOString(), doc:DOCCTX.rec.id};
  }, 'console');
  recompute(); closeDrawer(); render();
  toast(T('doc_receipted').replace('{r}', ref));
}

/* ------------------------------ coverage ------------------------------ */
function docCoverage(){
  const rows = [];
  UNITS.forEach(u=>{
    if(!u.occupied) return;
    const c = docsFor({type:'unit',unit:u.u}).filter(d=>d.kind==='contract').length;
    const billed = u.inst.filter(x=>x.billed);
    const paid = billed.filter(x=>x.paid);
    const withR = paid.filter(x=>docsFor({type:'inst',unit:u.u,inst:x.q}).length).length;
    rows.push({unit:u.u, tenant:L(u.tenant,u.tenant_ar), contract:c,
      value:u.rent, paid:paid.length, receipts:withR,
      gap: paid.length - withR,
      state: c && paid.length===withR ? T('doc_full') : c ? T('doc_part') : T('doc_none')});
  });
  return rows.sort((a,b)=>(b.gap-a.gap)||a.unit.localeCompare(b.unit,'en',{numeric:true}));
}

function repEvidence(){
  const rows = docCoverage();
  const withC = rows.filter(r=>r.contract).length;
  const paid = rows.reduce((a,r)=>a+r.paid,0), rec = rows.reduce((a,r)=>a+r.receipts,0);
  const jobs = WOS.filter(w=>w.status==='done');
  const jobsWith = jobs.filter(w=>docsFor({type:'wo',wo:w.id}).length).length;
  return {
    stats:[[T('doc_contracts'), NUM(withC)+' / '+NUM(rows.length), T('doc_contracts_d')],
           [T('doc_receipts'), NUM(rec)+' / '+NUM(paid), T('doc_receipts_d')],
           [T('doc_invoices'), NUM(jobsWith)+' / '+NUM(jobs.length), T('doc_invoices_d')]],
    cols:[{k:'unit',l:T('unit')},{k:'tenant',l:T('tenant')},{k:'value',l:T('h_annual'),num:1,money:1},
          {k:'contract',l:T('doc_k_contract'),num:1},{k:'paid',l:T('doc_settled'),num:1},
          {k:'receipts',l:T('doc_k_receipt'),num:1},{k:'gap',l:T('doc_gap'),num:1},
          {k:'state',l:T('status')}],
    rows,
    foot:{unit:T('rp_total'), value:rows.reduce((a,r)=>a+(r.value||0),0),
          contract:withC, paid, receipts:rec, gap:paid-rec},
    note:T('doc_cov_n')
  };
}

/* ------------------------------ rendering ------------------------------ */
function rpCell(c, v){
  if(v === null || v === undefined || v === '') return '<span class="sub2">—</span>';
  /* a footer row puts a label in the first column, whatever that column's type */
  if((c.date||c.month) && !(v instanceof Date)) return v;
  if(c.date)  return `<span class="mono">${fmtD(v)}</span>`;
  if(c.month) return `<span class="mono">${L(['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][v.getMonth()],
                        ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][v.getMonth()])} ${NUM(v.getFullYear())}</span>`;
  if(c.money) return `<span class="mono">${money(v)}</span>`;
  if(c.pct)   return `<span class="mono">${NUM(c.dec?Number(v).toFixed(1):Math.round(v))}%</span>`;
  if(c.dec)   return `<span class="mono">${NUM(Number(v).toFixed(1))}</span>`;
  if(c.num)   return `<span class="mono">${typeof v==='number'?NUM(v.toLocaleString('en-US')):NUM(v)}</span>`;
  return v;
}
function rpTable(cols, rows, foot){
  if(!rows || !rows.length) return '';
  return `<div class="tw"><table>
    <thead><tr>${cols.map(c=>`<th class="${c.num?'num':''}">${c.l}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map((c,i)=>
      `<td class="${c.num?'num':''} ${i===0?'strong':''}">${rpCell(c, r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody>
    ${foot?`<tfoot><tr style="background:#FBFCFC">${cols.map(c=>
      `<td class="${c.num?'num':''} strong">${foot[c.k]===undefined?'':rpCell(c, foot[c.k])}</td>`).join('')}</tr></tfoot>`:''}
  </table></div>`;
}

function pgRep(){

  let out;
  try{ out = meta.f(); }
  catch(e){ return rpLibrary() + `<div class="card"><div class="bd"><div class="warnbox">${I('alert',16,2.2)}<span>${e.message}</span></div></div></div>`; }

/* ------------------------------ export ------------------------------ */
function rpExport(id){
  const meta = REPORTS.find(r=>r.id===id); if(!meta) return;
  const out = meta.f(); if(out.blocked) return;
  const esc = v => {
    if(v === null || v === undefined) return '';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    const s = String(v).replace(/<[^>]*>/g,'');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const sheet = (title, cols, rows, foot) => {
    const lines = [title, cols.map(c=>esc(c.l)).join(',')];
    rows.forEach(r=>lines.push(cols.map(c=>esc(r[c.k])).join(',')));
    if(foot) lines.push(cols.map(c=>esc(foot[c.k])).join(','));
    return lines.join('\n');
  };
  let csv = sheet(rpName(id), out.cols, out.rows||[], out.foot);
  if(out.extra && out.extra.rows && out.extra.rows.length)
    csv += '\n\n' + sheet(out.extra.title, out.extra.cols, out.extra.rows, out.extra.foot);
  csv += `\n\n${esc(T('rp_exported'))},${esc(fmtD(TODAY))}`;
  if(out.period) csv += `\n${esc(T('rp_period'))},${esc(rpPeriodLabel())}`;
  if(out.note) csv += `\n${esc(out.note.replace(/<[^>]*>/g,''))}`;

  saveFile('almaria-' + id + '-' + TODAY.toISOString().slice(0,10) + '.csv',
           '﻿' + csv, 'text/csv;charset=utf-8');
}

/* Saving a file means different things in different places. Opened from a
   folder or a memory stick, a link does it. Inside a viewer that will not let
   a page start its own download, the host has to be asked and the person
   confirms. Try the host first, fall back to the link, and if neither will
   work put the text on the clipboard rather than pretending it saved. */
async function saveFile(name, text, mime){
  try{
    if(typeof claude !== 'undefined' && claude.use){
      const dl = await claude.use('downloads');
      if(dl){ await dl.save({filename:name, data:text}); toast(T('rp_exported_ok')); return; }
    }
  }catch(e){
    if(e && e.code === 'declined') return;                    /* they said no */
    if(e && (e.code === 'extension_not_enabled' || e.code === 'rejected_extension')){
      try{
        await navigator.clipboard.writeText(text);
        toast(L('This viewer will not save files, so the report is on your clipboard.',
                'هذا العارض لا يسمح بحفظ الملفات، وقد نُسخ التقرير إلى الحافظة.'));
        return;
      }catch(_){}
    }
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:mime}));
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(T('rp_exported_ok'));
  }catch(e){
    toast(L('Could not save the file here.','تعذّر حفظ الملف في هذا العارض.'));
  }
}

let FSORT={k:'unit',dir:1}, FONLY=false;
function fsort(k){ FSORT = (FSORT.k===k) ? {k,dir:-FSORT.dir} : {k,dir:k==='unit'?1:-1}; render(); }
function finRows(){
 const rows=UNITS.map(u=>{
  const maint=unitCost(u), coll=u.collected||0;
  return {u, annual:u.occupied?u.rent:0, billed:u.billed||0, coll,
    out:Math.max(0,u.outstanding||0), pre:Math.max(0,-(u.outstanding||0)),
    od:u.overdueDays||0, maint,
    net:coll-maint, pct:u.billed?maint/u.billed*100:0};
 });
 const k=FSORT.k, d=FSORT.dir;
 rows.sort((a,b)=>{
  if(k==='unit') return a.u.u.localeCompare(b.u.u,'en',{numeric:true})*d;
  return ((a[k]||0)-(b[k]||0))*d;
 });
 return rows;
}

/* One apartment, one line, aged from its oldest unpaid instalment — the same
   convention the collections sheet uses, so the two can be compared directly. */
function arrearsRows(){
 return UNITS.filter(u=>u.occupied && u.outstanding>0).map(u=>{
   const unpaid=u.inst.filter(x=>x.billed&&!x.paid).sort((a,b)=>a.due-b.due);
   const due=unpaid.length?unpaid[0].due:null;
   return {u, amt:u.outstanding, due,
           days: due?Math.floor((TODAY-due)/864e5):0};
 }).sort((a,b)=>b.days-a.days);
}
